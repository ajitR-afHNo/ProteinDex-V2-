repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files

  - repo: local
    hooks:
      - id: anti-slop-check
        name: ProteIndex Anti-Slop Audit
        entry: python scripts/anti_slop_check.py
        language: python
        pass_filenames: false
        always_run: true
